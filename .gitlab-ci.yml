stages:
  - verify
  - build
  - smoke

variables:
  CHECKOUT: /home/datons/repos/products/shellton-site
  COMPOSE: docker compose -p shellton-site --env-file docker/env/.env.example -f docker/compose.yml

.checkout: &checkout
  - cd "$CHECKOUT"
  - git fetch "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" main
  - git reset --hard FETCH_HEAD

verify:frontend:
  stage: verify
  image: oven/bun:1.3.6
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
        - docker/**/*
        - .gitlab-ci.yml
  cache:
    key: shellton-site-bun-${CI_COMMIT_REF_SLUG}
    paths: [frontend/.bun-cache]
  variables:
    BUN_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/frontend/.bun-cache
  before_script:
    - cd frontend
    - bun install --frozen-lockfile
  script:
    - bun run check
    - bun run build

build:
  stage: build
  tags: [datons-main]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - *checkout
    - $COMPOSE up -d --build web cloudflared

smoke:
  stage: smoke
  tags: [datons-main]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cd "$CHECKOUT"
    - |
      for i in $(seq 1 30); do
        cid="$($COMPOSE ps -q web)"
        status="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)"
        if [ "$status" = "healthy" ]; then
          echo "web healthy"
          exit 0
        fi
        sleep 2
      done
      echo "web did not become healthy"
      $COMPOSE logs --tail=80 web
      exit 1
